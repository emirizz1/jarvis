name: Jarvis APK Build (Telefondan)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK (preinstalled)
        run: |
          sdkmanager --version || true
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Make gradlew executable
        run: chmod +x ./gradlew && chmod +x jarvis-termux-apk/gradlew
      - name: Build Termux APK - Gri Daire Dalga
        run: |
          cd jarvis-termux-apk
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-gri-daire-apk
          path: jarvis-termux-apk/app/build/outputs/apk/debug/*.apk
